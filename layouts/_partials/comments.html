{{- if and hugo.IsProduction (not .Draft) }}
{{- with site.Params.giscus }}
<div class="giscus"
     data-repo="{{ .repo }}"
     data-repo-id="{{ .repoID }}"
     data-category="{{ .category }}"
     data-category-id="{{ .categoryID }}"
     data-mapping="pathname"
     data-strict="1"
     data-reactions-enabled="1"
     data-emit-metadata="0"
     data-input-position="top"
     data-lang="en"
     data-loading="lazy"></div>
<noscript><p><a href="https://github.com/{{ .repo }}/discussions">Join the discussion on GitHub.</a></p></noscript>
{{- end }}
{{- $script := resources.Get "js/comments.js" | minify | fingerprint }}
<script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" crossorigin="anonymous" defer></script>
{{- end }}
