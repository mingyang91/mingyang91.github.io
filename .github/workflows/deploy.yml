name: Build and deploy Hugo site

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: Asia/Shanghai
  HUGO_VERSION: 0.166.0
  HUGO_ARCHIVE: hugo_extended_0.166.0_linux-amd64.tar.gz
  HUGO_SHA256: 0e39b901e3f919f1daae05c8ff64f0c14c8a348ef46886d63f8e6d1bb2653885

jobs:
  build:
    name: Build Hugo site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and recursive submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned Hugo release
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_ARCHIVE}" \
            --output "${RUNNER_TEMP}/${HUGO_ARCHIVE}"
          printf '%s  %s\n' "${HUGO_SHA256}" "${RUNNER_TEMP}/${HUGO_ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${HUGO_ARCHIVE}" -C "${RUNNER_TEMP}" hugo
          sudo install -m 0755 "${RUNNER_TEMP}/hugo" /usr/local/bin/hugo
          hugo version

      - name: Build production site
        run: |
          hugo --environment production --minify --panicOnWarning
          python3 scripts/check_site.py
          test -s public/CNAME
          touch public/.nojekyll

      - name: Upload built site for deployment
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hugo-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Publish to gh-pages
    needs: build
    if: ${{ needs.build.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download built site
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: hugo-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: public

      - name: Check out legacy Pages branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: gh-pages
          path: .deploy_git
          ssh-key: ${{ secrets.HEXO_DEPLOY_PRI }}

      - name: Commit and push generated site
        run: |
          test -s public/CNAME
          touch public/.nojekyll
          git -C .deploy_git config user.name "mingyang91"
          git -C .deploy_git config user.email "my@famer.me"
          git -C .deploy_git rm -r --ignore-unmatch .
          cp -a public/. .deploy_git/
          git -C .deploy_git add --all
          if git -C .deploy_git diff --cached --quiet; then
            echo "gh-pages already has this site"
          else
            git -C .deploy_git commit -m "Deploy Hugo site (${GITHUB_SHA})"
            git -C .deploy_git push origin HEAD:gh-pages
          fi